<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
  </head>
  <body class="min-h-screen bg-slate-50">
    <div id="app" class="min-h-screen flex items-center justify-center p-6">
      <main class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-6">
        <h2
          id="quote"
          class="text-center text-1xl font-bold text-slate-800 mb-6"
        ></h2>
        <form id="searchForm" class="flex flex-col sm:flex-row gap-3">
          <label for="search"></label>
          <input
            class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-700"
            type="text"
            name="searchText"
            id="searchText"
          />
          <button
            id="searchBtn"
            class="rounded-xl bg-blue-500 px-6 py-3 text-black font-semibold hover:bg-blue-700 transition"
          >
            Search
          </button>
        </form>

        <div id="results" class="mt-6 flex flex-row gap-3 justify-center"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
